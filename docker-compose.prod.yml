services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URI=mongodb://mongo:27017/anna-doran
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-prod-secret-change-me-in-env}
      - NEXT_PUBLIC_SERVER_URL=http://135.181.40.227:3000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
