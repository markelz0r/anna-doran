services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    expose:
      - "3000"
    environment:
      - DATABASE_URI=mongodb://mongo:27017/anna-doran
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-prod-secret-change-me-in-env}
      - NEXT_PUBLIC_SERVER_URL=https://annadorandiet.com
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongo-data:
  certbot-webroot:
