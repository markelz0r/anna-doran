# Every address is redirected to https://www.annadorandiet.com so that search engines
# see a single version of each page. Without this, www and non-www served identical
# pages and Google reported them as duplicates.

server {
    listen 80;
    server_name annadorandiet.com www.annadorandiet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.annadorandiet.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name annadorandiet.com;

    ssl_certificate /etc/letsencrypt/live/annadorandiet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annadorandiet.com/privkey.pem;

    return 301 https://www.annadorandiet.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.annadorandiet.com;

    ssl_certificate /etc/letsencrypt/live/annadorandiet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annadorandiet.com/privkey.pem;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
